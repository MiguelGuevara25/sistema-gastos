services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: postgres_sistema_gastos_dev
    restart: always
    environment:
      POSTGRES_DB: sistema_gastos_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev: