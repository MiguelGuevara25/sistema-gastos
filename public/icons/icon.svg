<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- Glowing Emblem / Wallet -->
  <g filter="url(#glow)" transform="translate(106, 116)">
    <!-- Main Wallet Body -->
    <rect x="20" y="50" width="260" height="190" rx="36" fill="url(#accent)"/>
    <path d="M 20 100 L 280 100" stroke="#09090b" stroke-width="12" stroke-opacity="0.25"/>
    <!-- Wallet Flap & Clasp -->
    <path d="M 190 115 H 280 V 175 H 190 A 30 30 0 0 1 190 115 Z" fill="#09090b"/>
    <circle cx="215" cy="145" r="12" fill="url(#accent)"/>
    <!-- Card poking out -->
    <rect x="50" y="20" width="180" height="50" rx="16" fill="#f4f4f5" opacity="0.9"/>
  </g>
</svg>
